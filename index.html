    const s = c.items.reduce((x, i) => x + i.rub, 0);
    return `<h2><span>${esc(c.name)}</span><span>≈ ${s.toLocaleString("ru")} ₽</span></h2>` + c.items.map(i =>
      `<label class="it${st[i.id] ? " done" : ""}"><input type="checkbox" data-i="${esc(i.id)}"${st[i.id] ? " checked" : ""}>
       <span class="t"><div class="n">${esc(i.name)}</div><div class="q">купить: <b>${esc(i.buy)}</b> · нужно ${esc(i.need)}</div></span>
       <span class="r">${i.rub ? i.rub + " ₽" : ""}</span></label>`).join("");
  }).join("") + `<button class="reset" id="reset">Снять все отметки этого похода</button>`;
}
document.addEventListener("click", e => {
  const tb = e.target.closest(".tab");
  if (tb) { cur = tb.dataset.t; st._tab = cur; save(); render(); window.scrollTo(0, 0); return; }
  if (e.target.id === "reset") {
    const t = DATA.find(x => x.id === cur);
    t.cats.forEach(c => c.items.forEach(i => delete st[i.id])); save(); render(); return;
  }
});
document.addEventListener("change", e => {
  if (e.target.id === "hide") { st._hide = e.target.checked; save(); render(); return; }
  const id = e.target.dataset.i;
  if (id) { if (e.target.checked) st[id] = 1; else delete st[id]; save(); render(); }
});
render();
</script></body></html>
